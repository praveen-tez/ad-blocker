name: Build CLEARWAVE (Android APK & iOS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code analyzer & tests
        run: |
          flutter analyze
          flutter test test/database_test.dart test/filtering_test.dart test/native_platform_test.dart test/widget_test.dart

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: clearwave-android-apks
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS App (No Local Xcode Needed)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Simulator App
        run: flutter build ios --simulator --no-codesign

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --no-codesign

      - name: Upload iOS App Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clearwave-ios-build
          if-no-files-found: warn
          path: |
            build/ios/iphoneos/
            build/ios/iphonesimulator/

